
<!DOCTYPE html>
<html>
<head>
  <title>BetaGame - 2D MMORPG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="style.css"> <!-- style.css dosyan varsa bırak, yoksa kaldır -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: Verdana, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ---- Oyun çerçevesi: siteye gömülü bir pencere gibi (AQW tarzı) ----
       Sabit 16:9 oranı korunur, cihaz ne olursa olsun bozulma/gerilme olmaz.
       game.js içindeki GAME_WIDTH/GAME_HEIGHT (1280x720) ile birebir eşleşir. */
    #game-frame {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #000;
      flex-shrink: 0;
      touch-action: none;
    }
    #game-container {
      position: absolute;
      inset: 0;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #chat-container {
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: min(300px, calc(100% - 20px));
      height: 26%;
      max-height: 180px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 8px;
      z-index: 10;
    }
    #chat-messages {
      height: calc(100% - 34px);
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.35;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }
    #chat-messages .chat-line {
      display: block;
      margin: 0 0 6px 0;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #chat-messages .chat-user {
      color: #FFD700;
      font-weight: bold;
      margin-right: 4px;
    }
    #chat-messages .chat-text {
      color: #ffffff;
    }
    #chat-input {
      width: 100%;
      margin-top: 5px;
      padding: 6px;
      box-sizing: border-box;
      border-radius: 4px;
      border: none;
      max-width: 100%;
    }

    /* ---- Sunucu seçim ekranı (oyuna girmeden önce, AQW tarzı oda listesi) ---- */
    #server-select-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: radial-gradient(ellipse at top, #2a0808 0%, #0a0202 60%, #000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4% 4% 3%;
      box-sizing: border-box;
      overflow-y: auto;
      border: 2px solid #3a0d0d;
    }
    #server-select-overlay.hidden { display: none; }
    #server-select-overlay .ss-title {
      color: #ffd700;
      font-weight: bold;
      font-size: clamp(18px, 3.2vw, 26px);
      text-shadow: 2px 2px 3px #000;
      letter-spacing: 1px;
      margin: 0 0 2px;
    }
    #server-select-overlay .ss-subtitle {
      color: #ffcc66;
      font-size: clamp(11px, 1.6vw, 14px);
      margin-bottom: 18px;
    }
    #server-select-overlay .ss-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
      width: 100%;
      max-width: 640px;
    }
    @media (max-width: 480px) {
      #server-select-overlay .ss-grid { grid-template-columns: 1fr; }
    }
    #server-select-overlay .ss-row {
      background: linear-gradient(180deg, #8a1414, #4a0808);
      border: 1px solid #ffcc33;
      border-radius: 22px;
      padding: 9px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    #server-select-overlay .ss-row:hover {
      transform: scale(1.03);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.55);
    }
    #server-select-overlay .ss-row.full {
      background: linear-gradient(180deg, #3f3f3f, #1a1a1a);
      border-color: #777;
      cursor: not-allowed;
      opacity: 0.75;
    }
    #server-select-overlay .ss-row.full:hover {
      transform: none;
      box-shadow: none;
    }
    #server-select-overlay .ss-name {
      color: #ffe27a;
      font-weight: bold;
      font-size: clamp(13px, 2vw, 16px);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #server-select-overlay .ss-row.full .ss-name { color: #cfcfcf; }
    #server-select-overlay .ss-count {
      color: #ffd700;
      font-size: 11px;
      text-align: right;
      line-height: 1.3;
    }
    #server-select-overlay .ss-row.full .ss-count { color: #999; }
    #server-select-overlay .ss-count b {
      display: block;
      font-size: 14px;
    }
    #server-select-overlay .ss-loading {
      color: #ffcc66;
      font-size: 13px;
      margin-top: 20px;
    }

    /* ---- Site alt bilgisi (footer): klasik tarayıcı-oyunu sitesi hissi ---- */
    #site-footer {
      width: 100%;
      max-width: 1280px;
      background: #111;
      color: #ccc;
      text-align: center;
      padding: 12px 10px;
      box-sizing: border-box;
      border-top: 2px solid #FFD700;
      font-size: 12px;
      flex-shrink: 0;
    }
    #site-footer .brand {
      color: #FFD700;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 1px 1px 2px #000;
      margin-bottom: 6px;
    }
    #site-footer a {
      color: #FFD700;
      text-decoration: none;
      margin: 0 6px;
    }
    #site-footer a:hover {
      text-decoration: underline;
    }
    #site-footer .copyright {
      color: #777;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div id="game-frame">
    <div id="game-container"></div>
    <div id="chat-container" style="display:none;">
      <div id="chat-messages"></div>
      <input type="text" id="chat-input" placeholder="Mesaj yaz... (max 150)" maxlength="150" autocomplete="off">
    </div>
    <div id="server-select-overlay">
      <div class="ss-title">BetaGame Sunucuları</div>
      <div class="ss-subtitle" id="ss-subtitle">Yükleniyor...</div>
      <div class="ss-grid" id="ss-grid"></div>
    </div>
  </div>
  <div id="site-footer">
    <div class="brand">BetaGame</div>
    <div>
      <a href="/">Ana Sayfa</a> | <a href="#">Duyurular</a> | <a href="#">Hata Bildir</a> | <a href="#">Nasıl Oynanır?</a>
    </div>
    <div class="copyright">© 2024-2026 BetaGame. Tüm hakları saklıdır.</div>
  </div>
  <script src="/game.js" defer></script>
</body>
</html>
